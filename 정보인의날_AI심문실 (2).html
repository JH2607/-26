<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AI 심문실 — 워들 & 꼬맨틀 챌린지</title>
<style>
  :root{
    --bg:#0c0c0e;
    --panel:#1a1a1d;
    --panel-line:#333338;
    --ink:#e9e6dc;
    --ink-dim:#8c8a84;
    --caution:#f2c14e;
    --caution-dim:#7a6425;
    --alert:#c0392b;
    --spotlight:#fdf6e3;
    --mono: ui-monospace, 'SFMono-Regular', Consolas, 'Courier New', monospace;
    --sans: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(253,246,227,0.06), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  .tape{
    height:14px;
    width:100%;
    background: repeating-linear-gradient(45deg, var(--caution) 0 18px, #1a1a1a 18px 36px);
    flex-shrink:0;
    opacity:0.85;
  }
  header.casefile{
    padding:18px 20px 10px;
    border-bottom:1px solid var(--panel-line);
    text-align:center;
  }
  .case-id{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--ink-dim);
  }
  .case-title{
    font-size:22px;
    font-weight:800;
    margin:4px 0 2px;
    letter-spacing:-0.01em;
  }
  .case-sub{
    font-size:13px;
    color:var(--ink-dim);
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:16px;
    gap:14px;
    max-width:520px;
    width:100%;
    margin:0 auto;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:4px;
    padding:16px;
  }
  .panel h2{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--caution);
    margin:0 0 12px;
    font-weight:600;
  }
  .stage-toggle{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .stage-btn{
    flex:1;
    padding:12px 8px;
    background:#141416;
    border:1px solid var(--panel-line);
    border-radius:4px;
    color:var(--ink-dim);
    font-family:var(--sans);
    font-weight:700;
    font-size:14px;
    text-align:center;
  }
  .stage-btn.active{
    border-color:var(--caution);
    color:var(--caution);
    background:#1f1a0d;
  }
  select, .select-fake{
    width:100%;
    background:#141416;
    color:var(--ink);
    border:1px solid var(--panel-line);
    border-radius:4px;
    padding:12px;
    font-family:var(--mono);
    font-size:14px;
    margin-bottom:10px;
  }
  .hint-note{
    font-size:12px;
    color:var(--ink-dim);
    line-height:1.6;
    margin-top:6px;
  }
  .btn{
    display:block;
    width:100%;
    padding:14px;
    border-radius:4px;
    border:none;
    font-family:var(--sans);
    font-weight:800;
    font-size:15px;
    cursor:pointer;
  }
  .btn-primary{ background:var(--caution); color:#141414; }
  .btn-ghost{ background:transparent; color:var(--ink-dim); border:1px solid var(--panel-line); margin-top:8px;}
  .btn-danger{ background:transparent; color:var(--alert); border:1px solid var(--alert); }
  #game{ display:none; }
  #game.on{ display:flex; flex-direction:column; gap:14px;}
  .statusbar{
    display:flex;
    justify-content:space-between;
    font-family:var(--mono);
    font-size:13px;
    padding:0 2px;
  }
  .statusbar .label{ color:var(--ink-dim); font-size:10px; letter-spacing:0.05em; display:block;}
  .statusbar .val{ font-size:18px; font-weight:700;}
  .val.warn{ color:var(--alert); }
  .meter-wrap{
    padding: 4px 2px 2px;
  }
  .meter-label{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:var(--mono);
    margin-bottom:6px;
  }
  .meter-label .meter-title{
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:0.05em;
  }
  .meter-label .meter-pct{
    font-size:20px;
    font-weight:800;
    color:var(--caution);
  }
  .meter-track{
    background:#141416;
    border:1px solid var(--panel-line);
    border-radius:999px;
    height:12px;
    overflow:hidden;
  }
  .meter-fill{
    height:100%;
    background:linear-gradient(90deg, var(--caution-dim), var(--caution));
    width:0%;
    transition: width 0.25s ease;
  }
  .guess-form{ display:flex; gap:8px; }
  .guess-form input{
    flex:1;
    background:#141416;
    border:1px solid var(--panel-line);
    color:var(--ink);
    border-radius:4px;
    padding:14px;
    font-size:16px;
    font-family:var(--sans);
  }
  .guess-form input:focus{ outline:2px solid var(--caution); border-color:var(--caution);}
  .guess-form button{
    background:var(--caution);
    border:none;
    color:#141414;
    font-weight:800;
    border-radius:4px;
    padding:0 18px;
    font-size:14px;
    transition: filter 0.08s ease;
  }
  .guess-form button.pressed{
    filter: brightness(0.75);
  }
  .confirm-panel{
    text-align:center;
  }
  .confirm-panel .confirm-msg{
    font-weight:700;
    margin-bottom:12px;
    font-size:14px;
  }
  .hint-flash{
    color: var(--alert) !important;
  }
  .actions-row{ display:flex; gap:8px; }
  .actions-row button{ flex:1; }
  .btn-hint{
    background:transparent;
    border:1px dashed var(--caution-dim);
    color:var(--caution);
    padding:10px;
    border-radius:4px;
    font-weight:700;
    font-size:13px;
  }
  .transcript{
    font-family:var(--mono);
    font-size:19px;
  }
  .t-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    height:44px;
    padding:0 4px;
    border-bottom:1px solid #232326;
  }
  .t-row:first-child{ color:var(--ink-dim); font-size:13px; border-bottom:1px solid var(--panel-line); height:32px;}
  .t-row .word{
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:68%;
  }
  .t-row .score{ font-weight:800; }
  .t-row.hit .word, .t-row.hit .score{ color:var(--caution); }
  .t-row.hint-row .word{ color:#8ab0d4; font-style:italic; }
  .empty-transcript{ color:var(--ink-dim); font-size:12px; padding:8px 4px;}
  #end{ display:none; text-align:center; }
  #end.on{ display:block; }
  .grade{
    font-size:64px;
    font-weight:900;
    font-family:var(--mono);
    line-height:1;
    margin:6px 0;
  }
  .grade.S{ color:var(--caution); }
  .grade.A{ color:#9fd3a0; }
  .grade.B{ color:#8ab0d4; }
  .grade.F{ color:var(--alert); }
  .score-big{ font-family:var(--mono); font-size:20px; color:var(--ink-dim); margin-bottom:14px;}
  .breakdown{ text-align:left; font-family:var(--mono); font-size:16px; color:var(--ink-dim); margin:14px 0; line-height:2.1;}
  .breakdown b{ color:var(--ink); }
  .reward{
    background:#141416;
    border:1px solid var(--caution-dim);
    border-radius:4px;
    padding:14px;
    margin:14px 0;
    font-weight:700;
  }
  footer{
    text-align:center;
    padding:14px;
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-dim);
    letter-spacing:0.04em;
  }

  /* ---------- 데스크톱 / 큰 화면 (노트북 등) ---------- */
  @media (min-width: 900px){
    main{ max-width: 820px; padding: 32px 24px; gap: 20px; }
    .case-title{ font-size: 30px; }
    .case-sub{ font-size: 15px; }
    header.casefile{ padding: 26px 32px 14px; }
    .panel{ padding: 24px; }
    .meter-label .meter-pct{ font-size: 28px; }
    .meter-label .meter-title{ font-size: 13px; }
    .meter-track{ height: 16px; }
    .guess-form input{ font-size: 18px; padding: 16px; }
    .guess-form button{ font-size: 16px; padding: 0 26px; }
    .stage-btn{ font-size: 16px; padding: 14px 10px; }
    .btn{ font-size: 16px; padding: 16px; }
    .transcript{ font-size: 15px; }
    .grade{ font-size: 84px; }
    .score-big{ font-size: 24px; }
    .breakdown{ font-size: 15px; }
    .statusbar .val{ font-size: 22px; }
    /* 힌트 기록을 2열로 넉넉하게 */
    #transcriptBody{ max-height: 360px; overflow-y: auto; }
  }
</style>
</head>
<body>

<div class="tape"></div>

<header class="casefile">
  <div class="case-id">CASE FILE // 정보인의 날 — AI 검증 프로토콜</div>
  <div class="case-title">AI 심문실</div>
  <div class="case-sub">폭주 직전의 AI, 그 마음속 단어를 추적하십시오.</div>
</header>

<main>

  <section class="panel" id="setup">
    <h2>스태프 설정 // STAFF ONLY</h2>

    <div class="stage-toggle">
      <div class="stage-btn active" data-stage="stage1">1단계 · 워밍업</div>
      <div class="stage-btn" data-stage="stage2">2단계 · 랭킹전</div>
    </div>

    <label class="hint-note">단어 세트 (참가자 종료 후 매번 바꿔주세요)</label>
    <select id="wordsetSelect"></select>

    <div class="hint-note" id="setupNote"></div>

    <button class="btn btn-primary" id="startBtn" style="margin-top:14px;">참가자 입장 — 심문 시작</button>
  </section>

  <section id="game">
    <div class="statusbar">
      <div><span class="label">STAGE</span><span class="val" id="stageLabel">1단계</span></div>
      <div><span class="label">TIME</span><span class="val" id="timeVal">00:00</span></div>
      <div><span class="label">시도</span><span class="val" id="triesVal">0</span></div>
      <div><span class="label">힌트</span><span class="val" id="hintsVal">0</span></div>
    </div>

    <div class="meter-wrap">
      <div class="meter-label">
        <span class="meter-title">최고 유사도</span>
        <span class="meter-pct" id="bestPct">0%</span>
      </div>
      <div class="meter-track">
        <div class="meter-fill" id="meterFill"></div>
      </div>
    </div>

    <div class="guess-form">
      <input type="text" id="guessInput" placeholder="단어를 검색하십시오" autocomplete="off" />
      <button type="button" id="searchBtn">검색</button>
    </div>

    <div class="actions-row">
      <button type="button" class="btn-hint" id="hintBtn">🔦 힌트 요청 (-150점)</button>
      <button type="button" class="btn-hint" id="giveupBtn" style="border-color:var(--alert); color:var(--alert);">🚩 포기</button>
    </div>

    <div class="panel confirm-panel" id="giveupConfirm" style="display:none;">
      <div class="confirm-msg">정말 포기하시겠습니까?</div>
      <div class="actions-row">
        <button type="button" class="btn-hint" id="giveupYes" style="border-color:var(--alert); color:var(--alert);">예, 포기합니다</button>
        <button type="button" class="btn-hint" id="giveupNo">아니오, 계속할게요</button>
      </div>
    </div>

    <div class="panel transcript">
      <h2>심문 기록 // TRANSCRIPT</h2>
      <div class="t-row"><span>단어</span><span>유사도</span></div>
      <div id="transcriptBody">
        <div class="empty-transcript">아직 검색한 단어가 없습니다.</div>
      </div>
    </div>
  </section>

  <section class="panel" id="end">
    <h2 id="endHeader">// 심문 종료</h2>
    <div class="grade" id="gradeChar">-</div>
    <div class="score-big" id="scoreLine">SCORE 0</div>
    <div class="breakdown" id="breakdown"></div>
    <div class="reward" id="rewardLine"></div>
    <button class="btn btn-primary" id="nextBtn">다음 참가자 (설정으로)</button>
  </section>

</main>

<footer>NO INTERNET REQUIRED — 오프라인 백업 모드로 동작합니다</footer>

/* 목록에 없는 단어는 완전 랜덤이 아니라, 단어 글자를 이용한
   "고정된 의사난수"로 -25~20 사이 점수를 줘서 매번 같은 결과가
   나오도록 합니다 (그래야 게임이 재현 가능함). */
function hashScore(word, answer){
  let h = 0;
  const s = word + "::" + answer;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return (h % 46) - 25;
}

/* 공백 차이를 무시하기 위한 정규화 함수 (예: "컴퓨터 구조" == "컴퓨터구조") */
function normalizeWord(s){
  return s.replace(/\s+/g, '');
}

/* 점수 계산 우선순위 (공백은 전부 무시하고 비교함):
   1) 정답과 완전히 같으면 100
   2) 표에 정확히 있는 단어면 그 점수
   3) 정답 단어의 일부이거나(예: "크림" → "크림슨") 정답 단어를 포함하면
      → 65~95점 사이로 계산 (겹치는 비율에 따라, 최대한 후하게)
   4) 표에 있는 다른 단어의 일부이거나 그 단어를 포함하면(예: "정보대학교" → "정보대")
      → 그 단어 점수의 85%
   5) 위 어디에도 안 걸리면 고정 의사난수 (-25~20) */
function scoreGuess(word, table, answer){
  const normWord = normalizeWord(word);
  const normAnswer = normalizeWord(answer);

  for(const [key, val] of Object.entries(table)){
    if(normalizeWord(key) === normWord) return val;
  }

  if(normWord.length >= 2 && normAnswer.length >= 2 && (normAnswer.includes(normWord) || normWord.includes(normAnswer))){
    const ratio = Math.min(normWord.length, normAnswer.length) / Math.max(normWord.length, normAnswer.length);
    return Math.round(65 + ratio * 30);
  }

  let bestPartial = null;
  for(const [key, val] of Object.entries(table)){
    const normKey = normalizeWord(key);
    if(normKey.length < 2 || normWord.length < 2) continue;
    if(normWord.includes(normKey) || normKey.includes(normWord)){
      if(bestPartial === null || val > bestPartial) bestPartial = val;
    }
  }
  if(bestPartial !== null){
    return Math.max(0, Math.round(bestPartial * 0.85));
  }

  return hashScore(word, answer);
}

/* 힌트 공개 순서: HINTS 테이블(70점 이상만 들어있음)을 점수 오름차순으로
   정렬해서, 낮은 점수부터 하나씩 순서대로 공개합니다. */
function buildHintSequence(hintTable){
  return Object.entries(hintTable).sort((a,b)=>a[1]-b[1]).map(e => e[0]);
}

let state = null;
const HINT_BTN_DEFAULT_TEXT = '🔦 힌트 요청 (-150점)';
let hintFlashTimeout = null;

const setupNote = document.getElementById('setupNote');
const wordsetSelect = document.getElementById('wordsetSelect');
let currentStage = 'stage1';

function refreshWordsetOptions(){
  wordsetSelect.innerHTML = '';
  const sets = DATA[currentStage].sets;
  Object.keys(sets).forEach((key, idx)=>{
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = `단어 세트 ${idx+1} (정답: ${key})`;
    wordsetSelect.appendChild(opt);
  });
  const cfg = DATA[currentStage];
  setupNote.textContent = cfg.timeLimitSec
    ? `제한시간 ${cfg.timeLimitSec/60}분, 최대 시도 ${cfg.tryLimit}회 — 초과 시 실패(0점) 처리됩니다.`
    : `워밍업 단계는 시간/횟수 제한이 없습니다.`;
}
refreshWordsetOptions();

document.querySelectorAll('.stage-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.stage-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentStage = btn.dataset.stage;
    refreshWordsetOptions();
  });
});

document.getElementById('startBtn').addEventListener('click', startRound);

let timerInterval = null;

function startRound(){
  const stageCfg = DATA[currentStage];
  const answer = wordsetSelect.value;
  const table = stageCfg.sets[answer];
  const hintTable = stageCfg.hints[answer];
  const winAliases = (stageCfg.aliases && stageCfg.aliases[answer]) || [];

  state = {
    stage: currentStage,
    answer,
    table,
    winAliases,
    tries: 0,
    hints: 0,
    hintSequence: buildHintSequence(hintTable),
    hintSeqIndex: 0,
    hintTable,
    guesses: [],
    startTime: Date.now(),
    timeLimitSec: stageCfg.timeLimitSec,
    tryLimit: stageCfg.tryLimit,
    finished: false
  };

  document.getElementById('setup').style.display = 'none';
  document.getElementById('end').classList.remove('on');
  document.getElementById('game').classList.add('on');
  document.getElementById('giveupConfirm').style.display = 'none';
  document.getElementById('stageLabel').textContent = currentStage === 'stage1' ? '1단계' : '2단계';
  document.getElementById('transcriptBody').innerHTML = '<div class="empty-transcript">아직 검색한 단어가 없습니다.</div>';
  document.getElementById('bestPct').textContent = '0%';
  document.getElementById('meterFill').style.width = '0%';
  document.getElementById('triesVal').textContent = '0';
  document.getElementById('hintsVal').textContent = '0';
  document.getElementById('guessInput').value = '';
  document.getElementById('guessInput').focus();

  if(hintFlashTimeout){ clearTimeout(hintFlashTimeout); hintFlashTimeout = null; }
  const hintBtnEl = document.getElementById('hintBtn');
  hintBtnEl.textContent = HINT_BTN_DEFAULT_TEXT;
  hintBtnEl.classList.remove('hint-flash');

  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 250);
  updateTimer();
}

function updateTimer(){
  if(!state || state.finished) return;
  const elapsedSec = (Date.now() - state.startTime) / 1000;
  const timeVal = document.getElementById('timeVal');

  if(state.timeLimitSec){
    const remain = Math.max(0, state.timeLimitSec - elapsedSec);
    timeVal.textContent = fmtTime(remain);
    timeVal.classList.toggle('warn', remain <= 20);
    if(remain <= 0){
      endRound('fail_time');
    }
  } else {
    timeVal.textContent = fmtTime(elapsedSec);
  }
}

function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

function submitGuess(){
  if(!state || state.finished) return;
  const input = document.getElementById('guessInput');
  const word = input.value.trim();
  if(!word) return;
  input.value = '';

  state.tries++;
  document.getElementById('triesVal').textContent = state.tries;

  let score;
  let isWin = false;

  const normInput = normalizeWord(word);
  if(normInput === normalizeWord(state.answer) || state.winAliases.some(a => normalizeWord(a) === normInput)){
    score = 100;
    isWin = true;
  } else {
    score = scoreGuess(word, state.table, state.answer);
  }

  state.guesses.push({word, score, isHint:false, isWin});
  renderTranscript();
  updateBest();

  if(isWin){
    endRound('success');
    return;
  }

  if(state.tryLimit && state.tries >= state.tryLimit){
    endRound('fail_tries');
  }
}

function flashSearchButton(){
  const btn = document.getElementById('searchBtn');
  btn.classList.add('pressed');
  setTimeout(()=> btn.classList.remove('pressed'), 140);
}

document.getElementById('searchBtn').addEventListener('click', ()=>{
  flashSearchButton();
  submitGuess();
});

document.getElementById('guessInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    flashSearchButton();
    submitGuess();
  }
});

document.getElementById('hintBtn').addEventListener('click', ()=>{
  if(!state || state.finished) return;
  const guessedWords = new Set(state.guesses.map(g=>g.word));

  let next = null;
  while(state.hintSeqIndex < state.hintSequence.length){
    const candidate = state.hintSequence[state.hintSeqIndex];
    state.hintSeqIndex++;
    if(!guessedWords.has(candidate)){
      next = candidate;
      break;
    }
  }

  if(!next){
    const btn = document.getElementById('hintBtn');
    if(hintFlashTimeout) clearTimeout(hintFlashTimeout);
    btn.textContent = '❌ 더 이상 힌트가 없습니다';
    btn.classList.add('hint-flash');
    hintFlashTimeout = setTimeout(()=>{
      btn.textContent = HINT_BTN_DEFAULT_TEXT;
      btn.classList.remove('hint-flash');
      hintFlashTimeout = null;
    }, 1500);
    return;
  }
  state.hints++;
  document.getElementById('hintsVal').textContent = state.hints;
  state.guesses.push({word: next, score: state.hintTable[next], isHint:true, isWin:false});
  renderTranscript();
  updateBest();
});

document.getElementById('giveupBtn').addEventListener('click', ()=>{
  if(!state || state.finished) return;
  document.getElementById('giveupConfirm').style.display = 'block';
});

document.getElementById('giveupNo').addEventListener('click', ()=>{
  document.getElementById('giveupConfirm').style.display = 'none';
});

document.getElementById('giveupYes').addEventListener('click', ()=>{
  document.getElementById('giveupConfirm').style.display = 'none';
  endRound('fail_giveup');
});

function updateBest(){
  const best = state.guesses.length ? Math.max(...state.guesses.map(g=>g.score)) : 0;
  const clamped = Math.max(0, Math.min(100, best));
  document.getElementById('bestPct').textContent = `${Math.max(0,best)}%`;
  document.getElementById('meterFill').style.width = clamped + '%';
}

function renderTranscript(){
  const body = document.getElementById('transcriptBody');
  const sorted = [...state.guesses].sort((a,b)=>b.score - a.score);
  body.innerHTML = '';
  sorted.forEach(g=>{
    const row = document.createElement('div');
    row.className = 't-row' + (g.isWin ? ' hit' : '') + (g.isHint ? ' hint-row' : '');
    row.innerHTML = `<span class="word">${g.isHint ? '💡 ' : ''}${escapeHtml(g.word)}</span><span class="score">${g.score}%</span>`;
    body.appendChild(row);
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function endRound(result){
  state.finished = true;
  clearInterval(timerInterval);

  const elapsedSec = (Date.now() - state.startTime) / 1000;
  document.getElementById('game').classList.remove('on');
  const endEl = document.getElementById('end');
  endEl.classList.add('on');

  if(state.stage === 'stage1'){
    const isGiveup = (result === 'fail_giveup');
    document.getElementById('endHeader').textContent = isGiveup ? '// 워밍업 포기' : '// 워밍업 종료';
    document.getElementById('gradeChar').className = 'grade ' + (result === 'success' ? 'A' : 'F');
    document.getElementById('gradeChar').textContent = result === 'success' ? 'CLEAR' : (isGiveup ? '포기' : 'END');
    document.getElementById('scoreLine').textContent = `시도 ${state.tries}회 · ${fmtTime(elapsedSec)} 소요`;
    document.getElementById('breakdown').innerHTML = isGiveup
      ? `포기하셨습니다! 다음 참가자를 준비해주세요.`
      : `워밍업은 채점하지 않습니다. 참가자에게 2단계(랭킹전) 규칙을 안내해주세요.`;
    document.getElementById('rewardLine').style.display = 'none';
    return;
  }

  document.getElementById('rewardLine').style.display = 'block';

  let score = 0;
  let failed = (result !== 'success');

  if(!failed){
    score = Math.max(0, Math.round(
      1000 - (state.tries * 60) - (elapsedSec * 2.5) - (state.hints * 60)
    ));
  }
  if(elapsedSec > 180 || state.tries > 15){
    failed = true; score = 0;
  }

  let grade, gradeClass, rewardText;
  if(result === 'fail_giveup'){
    grade = '포기'; gradeClass = 'F';
    rewardText = '🚩 포기하셨습니다! 다음 기회에 다시 도전해보세요.';
  } else if(failed){
    grade = '실패'; gradeClass = 'F';
    rewardText = '안타깝네요 — 다음 기회에 다시 도전해보세요.';
  } else if(score >= 800 && state.tries <= 5){
    grade = 'S'; gradeClass = 'S';
    rewardText = '🏆 S등급 — 배민 5천원 상품권';
  } else if(score >= 600 && state.tries <= 10){
    grade = 'A'; gradeClass = 'A';
    rewardText = '🥈 A등급 — 배민 2천원 상품권';
  } else if(score >= 1 && state.tries <= 15){
    grade = 'B'; gradeClass = 'B';
    rewardText = '🎖️ B등급 — 따봉 칭찬';
  } else {
    grade = '실패'; gradeClass = 'F';
    rewardText = '안타깝네요 — 다음 기회에 다시 도전해보세요.';
  }

  document.getElementById('endHeader').textContent = (result === 'fail_giveup') ? '// 포기 접수' : '// 심문 종료 — 결과 보고서';
  document.getElementById('gradeChar').className = 'grade ' + gradeClass;
  document.getElementById('gradeChar').textContent = grade;
  document.getElementById('scoreLine').textContent = `SCORE ${score}`;
  document.getElementById('breakdown').innerHTML = `
    정답 단어 &nbsp;: <b>${escapeHtml(state.answer)}</b><br>
    시도 횟수 &nbsp;: <b>${state.tries}회</b> (-${state.tries*60}점)<br>
    소요 시간 &nbsp;: <b>${fmtTime(elapsedSec)}</b> (-${Math.round(elapsedSec*2.5)}점)<br>
    힌트 사용 &nbsp;: <b>${state.hints}회</b> (-${state.hints*60}점)
  `;
  document.getElementById('rewardLine').textContent = rewardText;
}

document.getElementById('nextBtn').addEventListener('click', ()=>{
  document.getElementById('end').classList.remove('on');
  document.getElementById('setup').style.display = 'block';
  refreshWordsetOptions();
});
</script>

</body>
</html>
